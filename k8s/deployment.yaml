apiVersion: apps/v1
kind: Deployment
metadata:
  name: einvoice-bff
  labels:
    app: einvoice-bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: einvoice-bff
  template:
    metadata:
      labels:
        app: einvoice-bff
    spec:
      containers:
        - name: bff
          image: ghcr.io/einvoice/bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: 'production'
            - name: DATABASE_URL
              value: 'postgresql://admin:password123@einvoice-postgres:5432/einvoice_user_db'
            - name: JWT_SECRET
              value: 'super_secret_jwt_key_at_least_32_characters_long'
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: einvoice-bff-service
spec:
  type: ClusterIP
  selector:
    app: einvoice-bff
  ports:
    - port: 80
      targetPort: 3000
      name: http
