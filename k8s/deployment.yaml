apiVersion: apps/v1
kind: Deployment
metadata:
  name: einvoice-bff
  labels:
    app: einvoice-bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: einvoice-bff
  template:
    metadata:
      labels:
        app: einvoice-bff
    spec:
      containers:
        - name: bff
          image: ghcr.io/snowyy16/e-invoice/bff:44b9e7e8d5abb3d835f3a6d01cd2504a05368032
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: 'production'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: einvoice-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: einvoice-secrets
                  key: JWT_SECRET
            - name: DB_SYNCHRONIZE
              value: 'true'
            - name: SEED_DATA
              value: 'true'
            - name: SEED_PASSWORD
              value: 'Password123!'
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: einvoice-bff-service
spec:
  type: ClusterIP
  selector:
    app: einvoice-bff
  ports:
    - port: 80
      targetPort: 3000
      name: http
