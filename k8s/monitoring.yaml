# cấu hình triển khai hệ thống giám sát thu thập số liệu prometheus và bảng điều khiển trực quan grafana
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    rule_files:
      - 'alert.rules.yml'
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager-service:9093']
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'einvoice-bff'
        metrics_path: '/api/metrics'
        static_configs:
          - targets: ['einvoice-bff-service:80']
  alert.rules.yml: |
    groups:
      - name: einvoice-bff-alerts
        rules:
          - alert: EinvoiceBffDown
            expr: up{job="einvoice-bff"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Dịch vụ Backend BFF bị gián đoạn"
              description: "Target {{ $labels.instance }} không phản hồi trong hơn 30 giây."
          - alert: EinvoiceBffHighMemory
            expr: process_resident_memory_bytes{job="einvoice-bff"} > 367001600
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Bộ nhớ RAM BFF vượt ngưỡng 350 MiB"
              description: "Pod {{ $labels.instance }} đang tiêu thụ RAM cao kéo dài quá 1 phút."
          - alert: EinvoiceBffHighEventLoopLag
            expr: nodejs_eventloop_lag_seconds{job="einvoice-bff"} > 0.1
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Độ trễ Event Loop Node.js cao (> 100ms)"
              description: "Event Loop của {{ $labels.instance }} bị nghẽn kéo dài hơn 1 phút."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
              ephemeral-storage: '256Mi'
            limits:
              memory: '512Mi'
              cpu: '500m'
              ephemeral-storage: '1Gi'
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config-volume
              mountPath: /etc/prometheus/alert.rules.yml
              subPath: alert.rules.yml
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
              ephemeral-storage: '256Mi'
            limits:
              memory: '512Mi'
              cpu: '500m'
              ephemeral-storage: '1Gi'
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: 'admin'
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: 'admin123'
          volumeMounts:
            - name: datasources-volume
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider-volume
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-files-volume
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources-volume
          configMap:
            name: grafana-datasources
        - name: dashboards-provider-volume
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-files-volume
          configMap:
            name: grafana-einvoice-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      receiver: 'default-receiver'
    receivers:
      - name: 'default-receiver'
      # Để bật gửi cảnh báo runtime trực tiếp về Telegram, xem mẫu k8s/alertmanager-telegram.example.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      automountServiceAccountToken: false
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
          ports:
            - containerPort: 9093
          resources:
            requests:
              memory: '64Mi'
              cpu: '50m'
              ephemeral-storage: '128Mi'
            limits:
              memory: '256Mi'
              cpu: '200m'
              ephemeral-storage: '512Mi'
          volumeMounts:
            - name: alertmanager-config-volume
              mountPath: /etc/alertmanager
      volumes:
        - name: alertmanager-config-volume
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-service
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
