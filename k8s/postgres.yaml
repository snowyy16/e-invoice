apiVersion: apps/v1
kind: Deployment
metadata:
  name: einvoice-postgres
  labels:
    app: einvoice-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: einvoice-postgres
  template:
    metadata:
      labels:
        app: einvoice-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: 'admin'
            - name: POSTGRES_PASSWORD
              value: 'password123'
            - name: POSTGRES_DB
              value: 'einvoice_user_db'
---
apiVersion: v1
kind: Service
metadata:
  name: einvoice-postgres
spec:
  type: ClusterIP
  selector:
    app: einvoice-postgres
  ports:
    - port: 5432
      targetPort: 5432
