# mẫu cấu hình secret (không chứa mật khẩu thật — dùng kubeseal để mã hóa sang k8s/sealed-secret.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: einvoice-secrets
  namespace: default
type: Opaque
stringData:
  POSTGRES_USER: '<CHANGE_ME_DB_USER>'
  POSTGRES_PASSWORD: '<CHANGE_ME_DB_PASSWORD>'
  POSTGRES_DB: 'einvoice_user_db'
  DATABASE_URL: 'postgresql://<CHANGE_ME_DB_USER>:<CHANGE_ME_DB_PASSWORD>@einvoice-postgres:5432/einvoice_user_db'
  JWT_SECRET: '<CHANGE_ME_JWT_SECRET_MIN_32_CHARS>'
