name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bff

jobs:
  # ===============================================================
  # 1. tích hợp liên tục tự động biên dịch kiểm tra sức khỏe kiểm thử và độ bao phủ mã nguồn
  # ===============================================================
  ci-build-and-test:
    name: 1. CI Automation (Build, Health Check & Tests)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: 'einvoice-enterprise-secret-jwt-key-32-chars-long'
      DATABASE_URL: 'postgresql://admin:password123@localhost:5432/einvoice_test_db'
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 1.1. Code Linting & Syntax Check
        run: pnpm run lint

      - name: 1.2. Build All Monorepo Projects (BFF & Frontends)
        run: pnpm run build

      - name: 1.3. Unit Testing & Code Coverage
        run: |
          pnpm nx test bff --coverage
          pnpm nx test utils --coverage

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7

  # ===============================================================
  # 2. kiểm tra bảo mật liên tục phân tích mã tĩnh thư viện phụ thuộc khóa bí mật và cổng bảo mật
  # ===============================================================
  continuous-security:
    name: 2. Continuous Security (Gitleaks, Audit, Trivy & Sonar)
    needs: ci-build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---2.1 phát hiện rò rỉ khóa bí mật bằng gitleaks ---
      - name: 2.1. Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ---2.2 kiểm toán lỗ hổng thư viện phụ thuộc ---
      - name: 2.2. Dependency Vulnerability Audit
        run: |
          echo "Scanning dependencies with pnpm audit..."
          pnpm audit --audit-level=high || echo "::warning::Pnpm audit detected vulnerabilities. Review security report."

      # ---2.3 quét hệ thống tệp tin và thư viện phụ thuộc bằng trivy ---
      - name: 2.3. Trivy Filesystem & Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'

      - name: Display Trivy FS Scan Results
        run: |
          if [ -f trivy-fs-report.txt ]; then
            cat trivy-fs-report.txt
          fi

      # ---2.4 phân tích chất lượng mã nguồn bằng sonarqube và sonarcloud ---
      - name: 2.4. SonarQube Code Quality Analysis
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      # ---2.5 cổng bảo mật lưu báo cáo bảo mật ---
      - name: 2.5. Upload Security Reports (Nexus / Artifact Stand-in)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-reports
          path: trivy-fs-report.txt
          retention-days: 7

  # ===============================================================
  # 3. quản lý gói thành phẩm đóng gói docker quét ảnh container và đẩy lên kho lưu trữ
  # ===============================================================
  docker-build-and-publish:
    name: 3. Artifact Management (Docker & GHCR)
    needs: continuous-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ github.sha }}

      # --- đóng gói ảnh docker cục bộ để quét bảo mật ---
      - name: Docker Build (Local for Scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- quét lỗ hổng bảo mật ảnh container bằng trivy ---
      - name: Run Trivy Image Scan (Security Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # --- đăng nhập vào kho lưu trữ ảnh container trên github ---
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- đẩy ảnh docker lên kho lưu trữ github ---
      - name: Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ===============================================================
  # 4. triển khai liên tục và nền tảng vận hành argocd cùng kubernetes
  # ===============================================================
  cd-deployment:
    name: 4. CD Deployment (Approval & Argo CD)
    needs: docker-build-and-publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # kích hoạt tính năng phê duyệt môi trường triển khai thủ công trên github
    environment:
      name: production
      url: https://einvoice.example.com

    steps:
      - name: Checkout Deployment Manifests
        uses: actions/checkout@v4

      - name: 4.1. GitOps Update & Push Kubernetes Manifest
        run: |
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Updating k8s/deployment.yaml with image: $NEW_IMAGE"
          sed -i "s|image: .*bff:.*|image: ${NEW_IMAGE}|g" k8s/deployment.yaml
          git diff k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore(gitops): update bff image to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:refs/heads/gitops --force
      - name: 4.2. Argo CD Sync Verification
        run: |
          echo "=========================================================="
          echo " [GitOps] Pushed updated manifest to branch: gitops"
          echo "   Target Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo " [Argo CD] Automated reconciliation triggered from gitops!"
          echo "=========================================================="

  # ===============================================================
  # 5. gửi thông báo trạng thái quy trình qua telegram bot
  # ===============================================================
  notify:
    name: 5. Pipeline Notification (Telegram)
    needs: [ci-build-and-test, continuous-security, docker-build-and-publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Pipeline Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets chua duoc cau hinh tren GitHub. Bo qua gui tin nhan."
            exit 0
          fi

          if [ "${{ needs.ci-build-and-test.result }}" == "success" ] && \
             [ "${{ needs.continuous-security.result }}" == "success" ] && \
             [ "${{ needs.docker-build-and-publish.result }}" == "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="THÀNH CÔNG (SUCCEEDED)"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="THẤT BẠI (FAILED)"
          fi

          # lấy dòng đầu tiên và loại bỏ ký tự gây lỗi định dạng văn bản trên telegram
          CLEAN_MSG=$(echo "$RAW_COMMIT_MSG" | head -n 1 | sed 's/[*_`\\]//g')
          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"

          MESSAGE="🚀 *E-INVOICE DEVSECOPS PIPELINE*
          $STATUS_ICON *Trạng thái:* $STATUS_TEXT
          📦 *Repository:* \`${{ github.repository }}\`
          🌿 *Nhánh:* \`${{ github.ref_name }}\`
          👤 *Tác giả:* ${{ github.actor }}
          🔗 *Commit:* [$SHORT_SHA](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          📝 *Nội dung:* $CLEAN_MSG
          ⏰ *Thời gian:* $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true"
