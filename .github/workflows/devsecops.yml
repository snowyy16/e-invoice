name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bff

jobs:
  # ===============================================================
  # 1. CI (AUTOMATION): BUILD, HEALTH CHECK, TEST & COVERAGE
  # ===============================================================
  ci-build-and-test:
    name: 2. CI Automation (Build, Health Check & Tests)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: 'einvoice-enterprise-secret-jwt-key-32-chars-long'
      DATABASE_URL: 'postgresql://admin:password123@localhost:5432/einvoice_test_db'
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 1.1. Code Linting & Syntax Check
        run: pnpm run lint

      - name: 1.2. Build Application & Health Check
        run: pnpm nx build bff

      - name: 1.3. Unit Testing & Code Coverage
        run: |
          pnpm nx test bff --coverage
          pnpm nx test utils --coverage

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7

  # ===============================================================
  # 2. CONTINUOUS SECURITY: SAST, SCA, SECRETS & SECURITY GATES
  # ===============================================================
  continuous-security:
    name: 2. Continuous Security (Gitleaks, Audit, Trivy & Sonar)
    needs: ci-build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 2.1. SECRET DETECTION (GITLEAKS) ---
      - name: 2.1. Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # --- 2.2. DEPENDENCY AUDIT (SCA) ---
      - name: 2.2. Dependency Vulnerability Audit
        run: |
          echo "Scanning dependencies with pnpm audit..."
          pnpm audit --audit-level=high || echo "::warning::Pnpm audit detected vulnerabilities. Review security report."

      # --- 2.3. TRIVY FILESYSTEM & DEPENDENCY SCAN ---
      - name: 2.3. Trivy Filesystem & Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'

      - name: Display Trivy FS Scan Results
        run: |
          if [ -f trivy-fs-report.txt ]; then
            cat trivy-fs-report.txt
          fi

      # --- 2.4. SONARQUBE / SONARCLOUD CODE QUALITY ANALYSIS ---
      - name: 2.4. SonarQube Code Quality Analysis
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      # --- 2.5. SECURITY GATES: LƯU BÁO CÁO BẢO MẬT ---
      - name: 2.5. Upload Security Reports (Nexus / Artifact Stand-in)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-reports
          path: trivy-fs-report.txt
          retention-days: 7

  # ===============================================================
  # 3. ARTIFACT MANAGEMENT: DOCKER BUILD, IMAGE SCAN & PUSH GHCR
  # ===============================================================
  docker-build-and-publish:
    name: 3. Artifact Management (Docker & GHCR)
    needs: continuous-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # --- DOCKER BUILD LOCAL ---
      - name: Docker Build (Local for Scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- TRIVY CONTAINER IMAGE SCAN ---
      - name: Run Trivy Image Scan (Security Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # --- LOG IN TO GITHUB CONTAINER REGISTRY (GHCR) ---
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- PUSH DOCKER IMAGE TO GHCR ---
      - name: Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ===============================================================
  # 4. CD (DEPLOYMENT) & RUNTIME PLATFORM (ARGOCD & KUBERNETES)
  # ===============================================================
  cd-deployment:
    name: 4. CD Deployment (Approval & Argo CD)
    needs: docker-build-and-publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # Kích hoạt tính năng GitHub Environment Approval (Manual Review)
    environment:
      name: production
      url: https://einvoice.example.com

    steps:
      - name: Checkout Deployment Manifests
        uses: actions/checkout@v4

      - name: Argo CD (GitOps) Sync Verification
        run: |
          echo "=========================================================="
          echo " [CD] Deployment approved by reviewer!"
          echo " [GitOps] Triggering Argo CD sync for image:"
          echo "   Target: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo " [K8s] Application successfully deployed to Kubernetes Cluster!"
          echo "=========================================================="
