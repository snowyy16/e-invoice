name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bff

jobs:
  # ===============================================================
  # 1. tích hợp liên tục tự động biên dịch kiểm tra sức khỏe kiểm thử và độ bao phủ mã nguồn
  # ===============================================================
  ci-build-and-test:
    name: 1. CI Automation (Build, Health Check & Tests)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: 'einvoice-enterprise-secret-jwt-key-32-chars-long'
      DATABASE_URL: 'postgresql://admin:password123@localhost:5432/einvoice_test_db'
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 1.1. Code Linting & Syntax Check
        run: pnpm run lint

      - name: 1.2. Build All Monorepo Projects (BFF & Frontends)
        run: pnpm run build

      - name: 1.3. Unit Testing & Code Coverage
        run: |
          pnpm nx test bff --coverage
          pnpm nx test utils --coverage

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7

  # ===============================================================
  # 2. kiểm tra bảo mật liên tục phân tích mã tĩnh thư viện phụ thuộc khóa bí mật và cổng bảo mật
  # ===============================================================
  continuous-security:
    name: 2. Continuous Security (Gitleaks, Audit, Trivy & Sonar)
    needs: ci-build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # job này chạy trên runner mới nên cần cài lại node + pnpm để `pnpm audit` chạy được
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0

      # ---2.1 phát hiện rò rỉ khóa bí mật bằng gitleaks ---
      - name: 2.1. Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---2.2 kiểm toán lỗ hổng thư viện phụ thuộc ---
      - name: 2.2. Dependency Vulnerability Audit
        run: |
          echo "Scanning dependencies with pnpm audit..."
          pnpm audit --audit-level=high || echo "::warning::Pnpm audit detected vulnerabilities. Review security report."

      # ---2.3 quét hệ thống tệp tin và thư viện phụ thuộc bằng trivy ---
      - name: 2.3. Trivy Filesystem & Dependency Scan
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Display Trivy FS Scan Results
        if: always()
        run: |
          if [ -f trivy-fs-report.txt ]; then
            cat trivy-fs-report.txt
          fi

      - name: 2.3b. Generate Trivy FS SARIF Report
        if: always()
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: 2.3c. Upload Trivy FS SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

      - name: Download Test Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
      - name: Fix LCOV Paths for Monorepo Root
        run: |
          sed -i 's|^SF:|SF:apps/be/bff/|' coverage/apps/be/bff/lcov.info
          sed -i 's|^SF:|SF:libs/utils/|' coverage/libs/utils/lcov.info

      # ---2.4 phân tích chất lượng mã nguồn bằng sonarqube và sonarcloud ---
      - name: 2.4. SonarQube Code Quality Analysis
        uses: sonarsource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ---2.5 cổng bảo mật lưu báo cáo bảo mật ---
      - name: 2.5. Upload Security Reports (Nexus / Artifact Stand-in)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-reports
          path: trivy-fs-report.txt
          retention-days: 7

  # ===============================================================
  # 3. quản lý gói thành phẩm đóng gói docker quét ảnh container và đẩy lên kho lưu trữ
  #    - Pull request: chỉ build + quét, KHÔNG đăng nhập / đẩy image lên GHCR
  #    - Push vào main / manual: build + quét + đẩy lên GHCR
  # ===============================================================
  docker-build-and-publish:
    name: 3. Artifact Management (Docker & GHCR)
    needs: continuous-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ github.sha }}

      # --- đóng gói ảnh docker cục bộ để quét bảo mật ---
      - name: Docker Build (Local for Scanning)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- quét lỗ hổng bảo mật ảnh container bằng trivy ---
      - name: Run Trivy Image Scan (Security Gate)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate Trivy Image SARIF Report
        if: always()
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy Image SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

      # --- chỉ đăng nhập + đẩy image khi KHÔNG phải pull request ---
      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ===============================================================
  # 4. triển khai liên tục và nền tảng vận hành argocd cùng kubernetes
  #    Chỉ chạy khi push / manual trên main. Pull request sẽ bị skip
  #    (không cần approval nên vẫn merge được bình thường).
  # ===============================================================
  cd-deployment:
    name: 4. CD Deployment (Approval & Argo CD)
    needs: docker-build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    # kích hoạt tính năng phê duyệt môi trường triển khai thủ công trên github
    environment:
      name: production
      url: https://einvoice.example.com

    steps:
      - name: Checkout Deployment Manifests
        uses: actions/checkout@v4

      - name: 4.1. GitOps Update & Push Kubernetes Manifest
        run: |
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Updating k8s/deployment.yaml with image: $NEW_IMAGE"
          sed -i "s|image: .*bff:.*|image: ${NEW_IMAGE}|g" k8s/deployment.yaml
          git diff k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore(gitops): update bff image to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:refs/heads/gitops --force

      - name: 4.2. Argo CD Sync Verification
        run: |
          echo "=========================================================="
          echo " [GitOps] Pushed updated manifest to branch: gitops"
          echo "   Target Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo " [Argo CD] Automated reconciliation triggered from gitops!"
          echo "=========================================================="

  # ===============================================================
  # 5. gửi thông báo trạng thái quy trình qua telegram bot
  #    Chạy SAU khi CD kết thúc (success / failure / rejected / skipped)
  #    - Pull request: CD bị skip -> vẫn coi là thành công nếu CI/Security/Docker pass
  #    - Push main: CD phải success mới tính là thành công
  # ===============================================================
  notify:
    name: 5. Pipeline Notification (Telegram)
    needs:
      - ci-build-and-test
      - continuous-security
      - docker-build-and-publish
      - cd-deployment
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Pipeline Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
          CI_RESULT: ${{ needs.ci-build-and-test.result }}
          SEC_RESULT: ${{ needs.continuous-security.result }}
          DOCKER_RESULT: ${{ needs.docker-build-and-publish.result }}
          CD_RESULT: ${{ needs.cd-deployment.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets chua duoc cau hinh tren GitHub. Bo qua gui tin nhan."
            exit 0
          fi

          # CD hợp lệ khi: success (đã deploy) hoặc skipped (PR / không phải main)
          if [ "$CI_RESULT" == "success" ] && \
             [ "$SEC_RESULT" == "success" ] && \
             [ "$DOCKER_RESULT" == "success" ] && \
             { [ "$CD_RESULT" == "success" ] || [ "$CD_RESULT" == "skipped" ]; }; then
            STATUS_ICON="✅"
            STATUS_TEXT="THÀNH CÔNG (SUCCEEDED)"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="THẤT BẠI (FAILED)"
          fi

          case "$CD_RESULT" in
            success)   CD_TEXT="✅ Đã triển khai" ;;
            skipped)
              if [ "$EVENT_NAME" == "pull_request" ]; then
                CD_TEXT="⏭️ Bỏ qua (Pull Request)"
              else
                CD_TEXT="⏭️ Bỏ qua"
              fi ;;
            failure)   CD_TEXT="❌ Thất bại / bị từ chối phê duyệt" ;;
            cancelled) CD_TEXT="⚠️ Đã hủy" ;;
            *)         CD_TEXT="$CD_RESULT" ;;
          esac

          # lấy dòng đầu tiên và loại bỏ ký tự gây lỗi định dạng văn bản trên telegram
          CLEAN_MSG=$(echo "$RAW_COMMIT_MSG" | head -n 1 | sed 's/[*_`\\]//g')
          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"

          MESSAGE="🚀 *E-INVOICE DEVSECOPS PIPELINE*
          $STATUS_ICON *Trạng thái:* $STATUS_TEXT
          🚢 *CD Deployment:* $CD_TEXT
          📦 *Repository:* \`${{ github.repository }}\`
          🌿 *Nhánh:* \`${{ github.ref_name }}\`
          👤 *Tác giả:* ${{ github.actor }}
          🔗 *Commit:* [$SHORT_SHA](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          📝 *Nội dung:* $CLEAN_MSG
          ⏰ *Thời gian:* $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true"
